<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 24px;
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        label {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            font-weight: bold;
            gap: 8px;
        }
        input, select, textarea, button {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
        }
        textarea {
            min-height: 90px;
            resize: vertical;
        }
        .form-actions {
            display: flex;
            align-items: end;
            gap: 10px;
        }
        button {
            cursor: pointer;
            border: none;
            transition: 0.2s ease;
        }
        .primary {
            background: #2563eb;
            color: white;
        }
        .secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .danger {
            background: #dc2626;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #eef2ff;
        }
        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }
        .pending { background: #fef3c7; color: #92400e; }
        .in-progress { background: #dbeafe; color: #1d4ed8; }
        .completed { background: #dcfce7; color: #166534; }
        .low { background: #e0f2fe; color: #075985; }
        .medium { background: #fef3c7; color: #92400e; }
        .high { background: #fee2e2; color: #991b1b; }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        @media (max-width: 640px) {
            body { padding: 16px; }
            .header { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Task Manager</h1>
            <button class="secondary" type="button" onclick="loadTasks()">Refresh</button>
        </div>

        <div class="card">
            <form id="taskForm">
                <input type="hidden" id="taskId">

                <label>
                    Title
                    <input type="text" id="title" placeholder="Enter task title" required>
                </label>

                <label>
                    Status
                    <select id="status">
                        <option value="PENDING">Pending</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </label>

                <label>
                    Priority
                    <select id="priority">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </label>

                <label style="grid-column: 1 / -1;">
                    Description
                    <textarea id="description" placeholder="Add task details..."></textarea>
                </label>

                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button class="primary" type="submit">Save Task</button>
                    <button class="secondary" type="button" onclick="resetForm()">Clear</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Tasks</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const apiUrl = '/api/tasks';

        const taskForm = document.getElementById('taskForm');
        const taskTableBody = document.getElementById('taskTableBody');

        taskForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const task = {
                id: document.getElementById('taskId').value || null,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                status: document.getElementById('status').value,
                priority: document.getElementById('priority').value
            };

            const isEditing = !!task.id;

            const response = isEditing
                ? await fetch(`${apiUrl}/${task.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                })
                : await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });

            if (response.ok) {
                resetForm();
                loadTasks();
            } else {
                alert('Unable to save task. Please check the details.');
            }
        });

        async function loadTasks() {
            const response = await fetch(apiUrl);
            const tasks = await response.json();
            taskTableBody.innerHTML = '';

            if (!tasks.length) {
                taskTableBody.innerHTML = `
                    <tr>
                        <td colspan="7">No tasks found. Add your first task.</td>
                    </tr>
                `;
                return;
            }

            tasks.forEach(task => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${task.id}</td>
                    <td>${task.title}</td>
                    <td>${task.description || '-'}</td>
                    <td><span class="badge ${task.status.toLowerCase().replace('_', '-')}">${task.status}</span></td>
                    <td><span class="badge ${task.priority.toLowerCase()}">${task.priority}</span></td>
                    <td>${new Date(task.createdAt).toLocaleString()}</td>
                    <td>
                        <div class="actions">
                            <button class="secondary" type="button" onclick="editTask(${task.id})">Edit</button>
                            <button class="danger" type="button" onclick="deleteTask(${task.id})">Delete</button>
                        </div>
                    </td>
                `;
                taskTableBody.appendChild(row);
            });
        }

        async function deleteTask(id) {
            if (!confirm('Delete this task?')) return;

            const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            if (response.ok) {
                resetForm();
                loadTasks();
            }
        }

        async function editTask(id) {
            const response = await fetch(`${apiUrl}/${id}`);
            const task = await response.json();

            document.getElementById('taskId').value = task.id;
            document.getElementById('title').value = task.title;
            document.getElementById('description').value = task.description || '';
            document.getElementById('status').value = task.status;
            document.getElementById('priority').value = task.priority;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            taskForm.reset();
            document.getElementById('taskId').value = '';
            document.getElementById('priority').value = 'MEDIUM';
            document.getElementById('status').value = 'PENDING';
        }

        loadTasks();
    </script>
</body>
</html>
